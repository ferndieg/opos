tado de Derecho que asegure el imperio de la ley como expresión de la voluntad popular.", "Proteger a todos los españoles y pueblos de España en el ejercicio de los derechos humanos, sus culturas y tradiciones, lenguas e instituciones.", "Promover el progreso de la cultura y de la economía para asegurar a todos un digno nivel de vida."], "a": 2, "j": "En el preámbulo de la Constitución, se proclama la voluntad de proteger a todos los españoles y pueblos de España en el ejercicio de los derechos humanos, sus culturas y tradiciones, lenguas e instituciones."}, {"id": 122, "q": "Conforme dispone el artículo 22.4 de la Constitución Española, las asociaciones sólo podrán ser disueltas o suspendidas en sus actividades:", "o": ["En virtud de resolución judicial expresa.", "En virtud de resolución judicial motivada.", "En virtud de resolución administrativa o judicial expresa.", "En virtud de resolución administrativa o judicial motivada"], "a": 1, "j": "Las asociaciones sólo podrán ser disueltas o suspendidas en sus actividades en virtud de resolución judicial motivada, según el artículo 22.4 de la Constitución."}, {"id": 123, "q": "Según el artículo 10.2 de la Constitución Española, las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con la Declaración Universal de Derechos Humanos y:", "o": ["Los tratados y acuerdos internacionales sobre las mismas materias ratificados por España.", "La legislación de desarrollo promulgada al efecto.", "Los Acuerdos de la Asamblea de Naciones Unidas en materia de Derechos Humanos.", "Las respuestas b) y c) son correctas."], "a": 0, "j": "Las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España (art. 10.2 CE)."}, {"id": 124, "q": "La CE establece la igualdad de los españoles ante la ley sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, religión, opinión o cualquier otra condición o circunstancia personal o social, en el artículo:", "o": ["13.", "14.", "15.", "16."], "a": 1, "j": "Dispone el artículo 14 de la Constitución que los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social."}, {"id": 125, "q": "La Constitución permite expresamente:", "o": ["Los Tribunales de excepción.", "Los Tribunales de honor que se creen en la Administración civil.", "Los Tribunales populares.", "Los Tribunales consuetudinarios."], "a": 3, "j": "Los ciudadanos podrán ejercer la acción popular y participar en la Administración de Justicia mediante la institución del Jurado, en la forma y con respecto a aquellos procesos penales que la ley determine, así como en los Tribunales consuetudinarios y tradicionales, según establece el art. 125 CE."}, {"id": 126, "q": "Los derechos económicos de los trabajadores españoles en el extranjero se regulan en:", "o": ["En el artículo 41 CE.", "En el artículo 42 CE.", "En el artículo 43 CE.", "En el artículo 44.1 CE."], "a": 1, "j": "El artículo 42 CE dicta que el Estado velará especialmente por la salvaguardia de los derechos económicos y sociales de los trabajadores españoles en el extranjero y orientará su política hacia su retorno."}, {"id": 127, "q": "La Constitución entró en vigor:", "o": ["Al día siguiente de su publicación en el BOE.", "El mismo día de su publicación en el BOE.", "Al día siguiente del referéndum que la aprobó.", "Todas son falsas."], "a": 1, "j": "Dispone la disposición final de la Constitución que la misma entrará en vigor el mismo día de la publicación de su texto oficial en el boletín oficial del Estado."}, {"id": 128, "q": "El procedimiento de “habeas corpus” garantiza:", "o": ["La asistencia de abogado al detenido en las diligencias policiales y judiciales.", "El derecho de toda persona detenida a ser informada de forma inmediata de sus derechos y de las razones de su detención.", "El derecho de toda persona detenida a ser puesta en libertad o a disposición de la autoridad judicial, una vez superado el plazo máximo establecido para la detención preventiva.", "La inmediata puesta a disposición judicial de toda persona detenida ilegalmente."], "a": 3, "j": "Según preceptúa el artículo 17.4 constitucional, el mecanismo de Habeas Corpus tiene por objeto lograr la inmediata puesta a disposición judicial de toda persona detenida ilegalmente."}, {"id": 129, "q": "¿En qué artículo de la Constitución Española, se establece que los poderes públicos mantendrán un régimen público de seguridad social para todos los ciudadanos?", "o": ["Artículo 63.", "Artículo 41.", "Artículo 10.", "Artículo 39."], "a": 1, "j": "Los poderes públicos mantendrán un régimen público de Seguridad Social para todos los ciudadanos, que garantice la asistencia y prestaciones sociales suficientes ante situaciones de necesidad, especialmente en caso de desempleo. La asistencia y prestaciones complementarias serán libres (art. 41 CE)."}, {"id": 130, "q": "¿Cuál de estas afirmaciones es correcta de acuerdo con la Constitución?:", "o": ["Las penas privativas de libertad están orientadas hacia la reeducación pudiendo consistir en trabajos forzados.", "El condenado a pena de prisión tendrá derecho a un trabajo remunerado.", "La Administración civil puede imponer sanciones que impliquen privación de libertad.", "Las medidas de seguridad no pueden darse en nuestro ordenamiento jurídico."], "a": 1, "j": "De acuerdo con el artículo 25.2 de la Constitución, el recluso condenado a pena de prisión que cumpla la misma tendrá derecho a un trabajo remunerado."}, {"id": 131, "q": "No es nota fundamental del Estado Social:", "o": ["Establecer un sistema jerárquico de normas.", "Asumir la redistribución social de la producción.", "Prestar servicios sociales.", "Facilitar la participación ciudadana en la vida política y social."], "a": 0, "j": "La jerarquía normativa es una garantía del Estado de Derecho consagrada en el artículo 9.3 de la Constitución, mientras que las demás opciones responden a los principios rectores y mandatos de intervención de los poderes públicos del Estado Social, cuyo objetivo principal es remover los obstáculos para lograr una libertad e igualdad reales y efectivas mediante la prestación de servicios, la redistribución y el fomento de la participación ciudadana."}, {"id": 132, "q": "Los principios rectores de la política social y económica del Estado se encuentran en:", "o": ["Capítulo II del Título I CE.", "Capítulo II del Título I, en su sección lª CE.", "Capítulo III del Título I CE.", "Capítulo II del Título I en su sección 2ª CE."], "a": 2, "j": "Los principios rectores de la política social y económica del Estado se encuentran en el Capítulo III del Título I de la Constitución Española."}, {"id": 133, "q": "La participación de la juventud en todos los aspectos de la vida social se contempla:", "o": ["En el artículo 41 CE.", "En el artículo 45.2 CE.", "En el artículo 48 CE.", "En el artículo 49 CE."], "a": 2, "j": "Los poderes públicos promoverán las condiciones para la participación libre y eficaz de la juventud en el desarrollo político, social, económico y cultural, según el artículo 48 de la Constitución."}, {"id": 134, "q": "En caso de declaración del estado de excepción podrá suspenderse:", "o": ["El derecho de asociación.", "El derecho a sindicarse libremente. (28.1)", "El derecho a la huelga.", "El derecho a la negociación colectiva laboral. (37.1)"], "a": 2, "j": "El artículo 55.1 de la Constitución contempla el derecho a la huelga entre los derechos que pueden ser suspendidos tras la declaración del estado de excepción o de sitio, mientras que las demás opciones no son susceptibles de suspensión colectiva."}, {"id": 135, "q": "El derecho de const LETTERS = ['A','B','C','D'];
const KEY = 'testTema1CE_v1';
const BY_ID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const $ = id => document.getElementById(id);

let S = null;            // sesión actual
let cfg = { count: 'all', shuffle: false };
let tabFilter = 'all';
let timer = null;

/* ---------- Utilidades ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
const clear = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
const fmtTime = s => { const m = Math.floor(s / 60), r = s % 60; return m + ' min ' + String(r).padStart(2, '0') + ' s'; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
function toast(msg) { const t = el('div', 'toast', msg); document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

const qAt = i => BY_ID[S.order[i]];
const isChecked = id => S.finished || !!S.checked[id];
const verdictOf = id => { const a = S.answers[id]; if (a === undefined) return 'blank'; return a === BY_ID[id].a ? 'ok' : 'bad'; };

/* ---------- Pantallas ---------- */
function show(name) {
  ['Start', 'Quiz', 'Result'].forEach(n => $('screen' + n).classList.toggle('hidden', n !== name));
  $('bottomBar').classList.toggle('hidden', name !== 'Quiz');
  $('btnGrid').classList.toggle('hidden', name !== 'Quiz');
  $('progress').parentElement.classList.toggle('hidden', name !== 'Quiz');
  $('subtitle').textContent = name === 'Result' ? 'Resultados' : 'Cuestionario de preparación';
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ---------- Inicio ---------- */
function buildStart() {
  $('totalQ').textContent = QUESTIONS.length;
  const opts = [10, 20, 30, 50, 100, 'all'].filter(n => n === 'all' || n < QUESTIONS.length);
  const wrap = $('countChips'); wrap.innerHTML = '';
  opts.forEach(n => {
    const b = el('button', 'chip' + (cfg.count === n ? ' on' : ''), n === 'all' ? 'Todas (' + QUESTIONS.length + ')' : String(n));
    b.onclick = () => { cfg.count = n; buildStart(); };
    wrap.appendChild(b);
  });
  $('optShuffle').checked = cfg.shuffle;
  const prev = load();
  const box = $('resumeBox');
  if (prev && !prev.finished && prev.order && prev.order.length) {
    const done = Object.keys(prev.answers).length;
    $('resumeInfo').textContent = done + ' de ' + prev.order.length + ' respondidas';
    box.classList.remove('hidden');
  } else box.classList.add('hidden');
}

function newSession(ids) {
  S = { order: ids, answers: {}, checked: {}, revealed: {}, cur: 0, finished: false, elapsed: 0 };
  save(); startQuiz();
}

function startFromConfig() {
  cfg.shuffle = $('optShuffle').checked;
  let pool = QUESTIONS.map(q => q.id);
  const from = parseInt($('rFrom').value, 10), to = parseInt($('rTo').value, 10);
  if (from || to) {
    const lo = from || 1, hi = to || QUESTIONS.length;
    if (lo > hi) return toast('El rango no es válido');
    pool = pool.filter(id => id >= lo && id <= hi);
    if (!pool.length) return toast('No hay preguntas en ese rango');
  }
  if (cfg.count !== 'all' && cfg.count < pool.length) pool = shuffle(pool).slice(0, cfg.count).sort((a, b) => a - b);
  if (cfg.shuffle) pool = shuffle(pool);
  newSession(pool);
}

/* ---------- Test ---------- */
function startQuiz() {
  show('Quiz');
  renderQuestion();
  clearInterval(timer);
  timer = setInterval(() => { if (S && !S.finished) { S.elapsed++; if (S.elapsed % 10 === 0) save(); } }, 1000);
}

function updateProgress() {
  const total = S.order.length, done = S.order.filter(id => S.answers[id] !== undefined).length;
  $('progress').style.width = (done / total * 100) + '%';
  $('navCount').textContent = (S.cur + 1) + '/' + total;
}

function renderQuestion() {
  const q = qAt(S.cur), id = q.id, checked = isChecked(id), sel = S.answers[id];
  const card = $('qCard'); card.innerHTML = '';

  const head = el('div', 'qhead');
  head.appendChild(el('span', 'badge', 'Pregunta ' + (S.cur + 1) + ' de ' + S.order.length));
  const v = verdictOf(id);
  if (checked) head.appendChild(el('span', 'badge ' + (v === 'ok' ? 'ok' : v === 'bad' ? 'bad' : 'muted'), v === 'ok' ? '✓ Acertada' : v === 'bad' ? '✗ Fallada' : 'Sin responder'));
  else head.appendChild(el('span', 'badge muted', 'Nº ' + id + ' del documento'));
  card.appendChild(head);
  card.appendChild(el('h2', 'question', q.q));

  const list = el('div', 'options'); list.setAttribute('role', 'radiogroup');
  q.o.forEach((text, i) => {
    const b = el('button', 'option'); b.type = 'button'; b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', sel === i);
    let cls = '';
    let mark = '';
    if (checked) {
      b.disabled = true;
      if (i === q.a) { cls = 'correct'; mark = '✓'; }
      else if (i === sel) { cls = 'wrong'; mark = '✗'; }
      else cls = 'dim';
    } else if (sel === i) cls = 'sel';
    if (cls) b.classList.add(cls);
    b.appendChild(el('span', 'letter', LETTERS[i]));
    b.appendChild(el('span', 'txt', text));
    b.appendChild(el('span', 'mark', mark));
    b.onclick = () => selectOption(i);
    list.appendChild(b);
  });
  card.appendChild(list);

  const actions = el('div', 'actions');
  const bCheck = el('button', 'btn ok', '✔ Comprobar respuesta');
  bCheck.disabled = checked; bCheck.onclick = checkCurrent;
  const bJust = el('button', 'btn', S.revealed[id] ? '🙈 Ocultar justificación' : '💡 Ver justificación');
  bJust.onclick = toggleJust;
  actions.append(bCheck, bJust);
  card.appendChild(actions);

  if (checked) {
    const f = el('div', 'feedback ' + (v === 'ok' ? 'ok' : v === 'bad' ? 'bad' : 'warn'));
    f.textContent = v === 'ok' ? '¡Correcto!' : v === 'bad' ? 'Incorrecto. La respuesta correcta es la ' + LETTERS[q.a] + '.' : 'No respondiste. La respuesta correcta es la ' + LETTERS[q.a] + '.';
    card.appendChild(f);
  }
  if (S.revealed[id]) {
    const j = el('div', 'just');
    j.appendChild(el('h4', '', 'Justificación · Respuesta correcta: ' + LETTERS[q.a]));
    j.appendChild(el('p', '', q.j));
    card.appendChild(j);
  }

  $('btnPrev').disabled = S.cur === 0;
  const last = S.cur === S.order.length - 1;
  $('btnNext').textContent = last ? 'Finalizar 🏁' : 'Siguiente →';
  updateProgress();
  S.finished ? $('btnFinish').classList.add('hidden') : $('btnFinish').classList.remove('hidden');
}

function selectOption(i) {
  const id = qAt(S.cur).id;
  if (isChecked(id)) return;
  S.answers[id] = S.answers[id] === i ? undefined : i;
  if (S.answers[id] === undefined) delete S.answers[id];
  save(); renderQuestion();
}

function checkCurrent() {
  const id = qAt(S.cur).id;
  if (S.answers[id] === undefined) return toast('Selecciona una respuesta primero');
  S.checked[id] = true; save(); renderQuestion();
}

function toggleJust() {
  const id = qAt(S.cur).id;
  S.revealed[id] = !S.revealed[id]; save(); renderQuestion();
  if (S.revealed[id]) document.querySelector('.just')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function go(i) {
  if (i < 0 || i >= S.order.length) return;
  S.cur = i; save(); renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

function next() {
  if (S.cur === S.order.length - 1) { if (S.finished) showResults(); else finish(); }
  else go(S.cur + 1);
}

function finish() {
  const blank = S.order.filter(id => S.answers[id] === undefined).length;
  if (blank && !confirm('Tienes ' + blank + ' pregunta(s) sin responder. ¿Finalizar de todos modos?')) return;
  S.finished = true; save(); showResults();
}

/* ---------- Índice ---------- */
function openSheet() {
  const g = $('gridBubbles'); g.innerHTML = '';
  S.order.forEach((id, i) => {
    let cls = 'bubble';
    const a = S.answers[id];
    if (isChecked(id) && a !== undefined) cls += a === BY_ID[id].a ? ' ok' : ' bad';
    else if (a !== undefined) cls += ' answered';
    if (i === S.cur) cls += ' cur';
    const b = el('button', cls, String(i + 1)); b.title = 'Pregunta ' + (i + 1);
    b.onclick = () => { closeSheet(); go(i); };
    g.appendChild(b);
  });
  $('overlay').classList.remove('hidden');
}
const closeSheet = () => $('overlay').classList.add('hidden');

/* ---------- Resultados ---------- */
function showResults() {
  show('Result');
  const total = S.order.length;
  const ok = S.order.filter(id => verdictOf(id) === 'ok').length;
  const bad = S.order.filter(id => verdictOf(id) === 'bad').length;
  const blank = total - ok - bad;
  const pct = Math.round(ok / total * 1000) / 10;
  const grade = (ok / total * 10).toFixed(2);

  const r = 78, c = 2 * Math.PI * r, seg = n => c * n / total;
  $('donut').innerHTML =
    '<svg width="180" height="180" viewBox="0 0 180 180">' +
    '<circle cx="90" cy="90" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="16"/>' +
    '<circle cx="90" cy="90" r="' + r + '" fill="none" stroke="var(--warn)" stroke-width="16" stroke-dasharray="' + seg(ok + bad + blank) + ' ' + c + '" stroke-linecap="butt"/>' +
    '<circle cx="90" cy="90" r="' + r + '" fill="none" stroke="var(--bad)" stroke-width="16" stroke-dasharray="' + seg(ok + bad) + ' ' + c + '"/>' +
    '<circle cx="90" cy="90" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="16" stroke-dasharray="' + seg(ok) + ' ' + c + '"/>' +
    '</svg><div class="c"><b>' + pct + '%</b><span>de aciertos</span></div>';

  $('verdict').textContent = pct >= 90 ? '🏆 ¡Excelente!' : pct >= 70 ? '👏 ¡Muy bien!' : pct >= 50 ? '👍 Aprobado, sigue repasando' : '📚 Necesitas repasar más';
  $('timeInfo').textContent = 'Tiempo empleado: ' + fmtTime(S.elapsed || 0);

  const st = $('stats4'); st.innerHTML = '';
  [['ok', ok, 'Acertadas'], ['bad', bad, 'Falladas'], ['warn', blank, 'Sin responder'], ['pri', grade, 'Nota sobre 10']].forEach(([cls, n, label]) => {
    const d = el('div', 'stat ' + cls); d.append(el('b', '', String(n)), el('span', '', label)); st.appendChild(d);
  });
  $('btnRetryWrong').disabled = ok === total;
  tabFilter = 'all';
  renderTabs(ok, bad, blank, total);
  renderReview();
  clearInterval(timer);
}

function renderTabs(ok, bad, blank, total) {
  const t = $('tabs'); t.innerHTML = '';
  [['all', 'Todas', total], ['bad', 'Falladas', bad], ['ok', 'Acertadas', ok], ['blank', 'Sin responder', blank]].forEach(([k, label, n]) => {
    const b = el('button', 'tab' + (tabFilter === k ? ' on' : ''), label + ' (' + n + ')');
    b.onclick = () => { tabFilter = k; renderTabs(ok, bad, blank, total); renderReview(); };
    t.appendChild(b);
  });
}

function renderReview() {
  const list = $('reviewList'); list.innerHTML = '';
  let shown = 0;
  S.order.forEach((id, i) => {
    const v = verdictOf(id);
    if (tabFilter !== 'all' && tabFilter !== v) return;
    shown++;
    const q = BY_ID[id], a = S.answers[id];
    const item = el('div', 'rev ' + v);
    const h = el('button', 'rev-h');
    h.append(el('span', 'n', String(i + 1)), el('span', 'q', q.q), el('span', 'chev', '▾'));
    const b = el('div', 'rev-b hidden');
    const l1 = el('div', 'line');
    l1.append(el('span', 'tag ' + (v === 'ok' ? 'ok' : v === 'bad' ? 'bad' : 'warn'), v === 'ok' ? 'Acertada' : v === 'bad' ? 'Fallada' : 'Sin responder'));
    b.appendChild(l1);
    if (a !== undefined) { const l = el('div', 'line'); l.append(el('b', '', 'Tu respuesta: '), document.createTextNode(LETTERS[a] + ') ' + q.o[a])); b.appendChild(l); }
    const l2 = el('div', 'line'); l2.append(el('b', '', 'Correcta: '), document.createTextNode(LETTERS[q.a] + ') ' + q.o[q.a])); b.appendChild(l2);
    const l3 = el('div', 'line'); l3.style.color = 'var(--muted)'; l3.append(el('b', '', 'Justificación: '), document.createTextNode(q.j)); b.appendChild(l3);
    const go1 = el('button', 'btn ghost', 'Ir a la pregunta'); go1.style.marginTop = '8px';
    go1.onclick = () => { show('Quiz'); go(i); };
    b.appendChild(go1);
    h.onclick = () => { item.classList.toggle('open'); b.classList.toggle('hidden'); };
    item.append(h, b); list.appendChild(item);
  });
  if (!shown) list.appendChild(el('div', 'card', 'No hay preguntas en esta categoría.'));
}

/* ---------- Eventos ---------- */
$('btnStart').onclick = startFromConfig;
$('btnResume').onclick = () => { S = load(); startQuiz(); };
$('btnDiscard').onclick = () => { clear(); buildStart(); };
$('btnPrev').onclick = () => go(S.cur - 1);
$('btnNext').onclick = next;
$('btnIndex').onclick = openSheet;
$('btnGrid').onclick = openSheet;
$('btnCloseSheet').onclick = closeSheet;
$('overlay').onclick = e => { if (e.target === $('overlay')) closeSheet(); };
$('btnFinish').onclick = finish;
$('btnReview').onclick = () => { show('Quiz'); go(0); };
$('btnNew').onclick = () => { clear(); S = null; show('Start'); buildStart(); };
$('btnRetryWrong').onclick = () => {
  const ids = S.order.filter(id => verdictOf(id) !== 'ok');
  newSession(cfg.shuffle ? shuffle(ids) : ids);
};

document.addEventListener('keydown', e => {
  if (!S || $('screenQuiz').classList.contains('hidden') || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (!$('overlay').classList.contains('hidden')) { if (e.key === 'Escape') closeSheet(); return; }
  const k = e.key.toLowerCase();
  if (['a', 'b', 'c', 'd', '1', '2', '3', '4'].includes(k)) { const i = 'abcd'.includes(k) ? 'abcd'.indexOf(k) : +k - 1; if (!isChecked(qAt(S.cur).id)) { S.answers[qAt(S.cur).id] = i; save(); renderQuestion(); } }
  else if (k === 'enter') { if (e.target.tagName === 'BUTTON') return; e.preventDefault(); if (!isChecked(qAt(S.cur).id)) checkCurrent(); else next(); }
  else if (k === 'arrowright') next();
  else if (k === 'arrowleft') go(S.cur - 1);
  else if (k === 'j') toggleJust();
});

/* Tema */
function setTheme(t) { document.documentElement.dataset.theme = t; $('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙'; try { localStorage.setItem(KEY + '_theme', t); } catch (e) {} }
$('btnTheme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
setTheme((() => { try { return localStorage.getItem(KEY + '_theme'); } catch (e) { return null; } })() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

show('Start'); buildStart();
</script>
